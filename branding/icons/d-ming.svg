<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Concept D "明": the character drawn from geometric strokes (original artwork, no font),
       日 sun on the left, 月 moon on the right. Four Ounces: an Old Gold line glyph on the ink
       tile, round-ended like the 4oz mark. The KR version is in branding/retired/. -->
  <rect width="128" height="128" rx="28" fill="#0E0D0B"/>
  <g fill="none" stroke="#C9A24A" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- 日 -->
    <path d="M20 36 H49 V89 H20 Z"/>
    <path d="M20 62 H49"/>
    <!-- 月 -->
    <path d="M66 23 H102 V98 Q102 106 94 106 H89"/>
    <path d="M66 23 V76 Q66 95 56 105"/>
    <path d="M66 47 H102"/>
    <path d="M66 70 H102"/>
  </g>
</svg>
