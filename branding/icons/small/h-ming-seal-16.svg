<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- MingTab icon at 16 px, red seal (cream on vermilion), drawn on the pixel grid: seven horizontal strokes don't survive
       scaling down from 128, so each one sits on a whole pixel row. -->
  <rect width="16" height="16" rx="3.5" fill="#8A2A1E" shape-rendering="geometricPrecision"/>
  <g fill="#F4EAD5">
    <!-- 日: cols 2-5, rows 4-11 -->
    <rect x="2" y="4" width="4" height="1"/>
    <rect x="2" y="7" width="4" height="1"/>
    <rect x="2" y="11" width="4" height="1"/>
    <rect x="2" y="4" width="1" height="8"/>
    <rect x="5" y="4" width="1" height="8"/>
    <!-- 月: cols 8-13, rows 2-13 -->
    <rect x="8" y="2" width="6" height="1"/>
    <rect x="8" y="6" width="6" height="1"/>
    <rect x="8" y="9" width="6" height="1"/>
    <rect x="13" y="2" width="1" height="11"/>
    <rect x="11" y="13" width="2" height="1"/>
    <rect x="8" y="2" width="1" height="10"/>
    <rect x="7" y="12" width="1" height="1"/>
    <rect x="6" y="13" width="1" height="1"/>
  </g>
</svg>
