# Builds the extension and publishes a zip on a GitHub Release.
# Trigger: push a tag like v0.6.0 (it must match package.json's version),
# or run it by hand from the Actions tab.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build and zip
        run: npm run package

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.zip \
            --title "MingTab ${GITHUB_REF_NAME}" \
            --notes-file release/NOTES.md

      - name: Keep the zip (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: mingtab-zip
          path: release/*.zip
